<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raghav Pathak — About Me</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#1e2a3a;--mute:#5d6b7c;--acc:#4f7fa3;--ice:#eef4f9;--line:#d9e4ee}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%;background:#fff;color:var(--ink);font:300 clamp(15px,1.45vw,18px)/1.85 Inter,system-ui,sans-serif}
.serif,h1,h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500}
body{opacity:0;animation:in 1.2s ease forwards}
body.leaving{animation:none;opacity:0;transition:opacity .6s ease}
@keyframes in{to{opacity:1}}
/* entry page */
.entry{min-height:100vh;background:radial-gradient(circle at 50% 38%,#f1f7fc,#fff 65%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;padding:2rem}
.crest{position:relative;width:clamp(130px,22vmin,190px);aspect-ratio:1;display:grid;place-items:center;animation:float 7s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.crest .ring{position:absolute;inset:0;border-radius:50%;border:1px solid var(--acc);opacity:.7}
.crest .ring.o{inset:-14px;border-color:var(--line);opacity:1}
.crest svg{width:60%}
#role{display:flex;align-items:center;gap:.7rem;margin-top:2rem;height:1.6rem;font-size:.75rem;letter-spacing:.32em;text-transform:uppercase;color:var(--acc);font-weight:500;transition:opacity .9s}
#role.out{opacity:0}
#role svg{width:18px;height:18px;fill:none;stroke:var(--acc);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.entry h1{font-size:clamp(2.6rem,8vw,5.8rem);line-height:1.05;margin:1.4rem 0 .5rem}
.entry small{color:var(--mute);letter-spacing:.25em;font-size:.7rem;text-transform:uppercase;animation:soft 3.5s ease-in-out infinite}
@keyframes soft{50%{opacity:.35}}
/* content pages */
.page{min-height:100vh;padding:10vh 9vw 14vh;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.5fr);gap:6vw;align-content:center;align-items:center;background:linear-gradient(160deg,#fff 40%,var(--ice))}
.l .n{font-size:.72rem;letter-spacing:.35em;color:var(--acc);text-transform:uppercase}
.l h2{font-size:clamp(2rem,4.6vw,3.6rem);line-height:1.12;margin-top:1rem}
.l::after{content:"";display:block;width:56px;height:1px;background:var(--acc);margin-top:1.6rem;transform-origin:left;animation:line 1.6s ease .5s both}
@keyframes line{from{transform:scaleX(0)}}
.r p{color:#35445a;margin-bottom:1.1rem;max-width:40rem}
.rise{opacity:0;transform:translateY(14px);animation:rise 1.5s ease forwards;animation-delay:calc(var(--d,0)*.35s + .5s)}
@keyframes rise{to{opacity:1;transform:none}}
.chips{margin-top:1.4rem}
.chips span{display:inline-block;margin:.25rem .35rem .25rem 0;padding:.3rem 1rem;border:1px solid var(--line);border-radius:99px;background:#fff;font-size:.8rem;color:var(--mute)}
a.btn{display:inline-block;margin:1.2rem 1rem 0 0;padding:.75rem 1.7rem;border:1px solid var(--acc);color:var(--acc);text-decoration:none;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;transition:.4s;background:#fff}
a.btn:hover{background:var(--acc);color:#fff}
#bar{position:fixed;top:0;left:0;height:2px;background:var(--acc);z-index:10}
.hud{position:fixed;z-index:10;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 5vw}
.hud a.nv{background:#fff;border:1px solid var(--line);color:var(--ink);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;text-decoration:none;transition:.4s}
.hud a.nv:hover{border-color:var(--acc);color:var(--acc)}
.hud a.nv.off{visibility:hidden}
.hud .mid{font-size:.72rem;letter-spacing:.25em;color:var(--mute);text-decoration:none}
@media(max-width:760px){.page{grid-template-columns:1fr;gap:1.5rem;align-content:start;padding-top:12vh}}
@media print{.hud,#bar{display:none}.page{page-break-after:always}body,.rise{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}body,.rise{opacity:1;transform:none}}
</style></head>
<body>
<div class="entry"><div class="crest"><div class="ring o"></div><div class="ring"></div>
<svg viewBox="0 0 100 100"><circle cx="50" cy="34" r="15" fill="#1e2a3a"/><path d="M18 92c0-20 14-32 32-32s32 12 32 32z" fill="#1e2a3a"/><path d="M42 61l8 14 8-14" fill="#fff"/><path d="M48 66h4l2 18-4 5-4-5z" fill="#4f7fa3"/></svg></div>
<div id="role"><svg viewBox="0 0 24 24"></svg><span></span></div>
<h1 class="serif">Raghav Pathak</h1><small>Tap to begin</small></div>
<script>
// Entry page: slowly changing role line + tap to begin
const ROLES=[
["Developer",'<path d="M8 6l-6 6 6 6M16 6l6 6-6 6"/>'],
["Vocalist",'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v4"/>'],
["Announcer",'<path d="M3 10v4h4l7 5V5l-7 5zM17 8a5 5 0 010 8"/>'],
["Prompt Engineer",'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 10l3 2-3 2M13 15h4"/>'],
["Sandhya Incharge",'<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>']
];
const role=document.getElementById('role');let i=0;
const show=()=>{role.querySelector('svg').innerHTML=ROLES[i][1];role.querySelector('span').textContent=ROLES[i][0]};
show();
setInterval(()=>{role.classList.add('out');setTimeout(()=>{i=(i+1)%ROLES.length;show();role.classList.remove('out')},900)},3800);
const begin=()=>{document.body.classList.add('leaving');setTimeout(()=>location.href='about.html',650)};
document.querySelector('.entry').addEventListener('click',begin);
addEventListener('keydown',e=>{if(['Enter',' ','ArrowRight'].includes(e.key))begin()});
</script></body></html>
